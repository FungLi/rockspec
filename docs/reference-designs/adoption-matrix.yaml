        - "Engine 冻结 Task Brief、Review Subject、Commit 和 executed Evidence"
        - "Task Review 合并为 Spec/Design/Standards/Tests 四轴"
        - "修复上限为两轮，Final CR 移到 Acceptance 之后"
      rejected:
