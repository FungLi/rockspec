        - "skills/test-driven-development/SKILL.md"
        - "skills/verification-before-completion/SKILL.md"
    mechanism: "Fresh Implementer、TDD、Task Review 与完成前验证"
    decision:
      retained:
        - "Standard/Strict 每个 Task 使用独立 Implementer 和 Reviewer"
        - "测试先行、修复回原 Implementer、结论前运行验证"
