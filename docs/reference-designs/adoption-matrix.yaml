  - id: REF-SP-001
    source:
      project: Superpowers
      repository: "https://github.com/obra/superpowers"
      version: "6.2.0"
      commit: "44c9b2d6e889982ac18c27d05a19fefe335194e1"
      paths:
        - "skills/brainstorming/SKILL.md"
        - "skills/writing-plans/SKILL.md"
    mechanism: "先澄清和比较方案，再生成实施计划"
    decision:
      retained:
        - "一次只处理一个实质歧义"
        - "仓库探索、真实备选方案、分段确认和写后自检"
        - "准确文件职责与可执行 Task"
      changed:
        - "Requirements、Design、Plan 保持 Inline"
        - "Lite 不强制完整重流程，单一路径不虚构备选方案"
        - "Task 按可独立交付价值而非固定分钟数切分"
      rejected:
        - "复制原始 Skill Prompt 或把每个步骤暴露为用户 Skill"
    rockspec_targets:
      - "skills/rockspec-requirements"
      - "skills/rockspec-design"
      - "skills/rockspec-plan"
    verification:
      - "tests/host-assets.test.ts"
    implementation: independent
    license: MIT
    status: adopted

  - id: REF-SP-002
    source:
      project: Superpowers
      repository: "https://github.com/obra/superpowers"
      version: "6.2.0"
      commit: "44c9b2d6e889982ac18c27d05a19fefe335194e1"
