schema_version: 1
purpose: "记录 RockSpec 对外部设计机制的来源、清洗决策、独立实现落点和验证方式。"
runtime_dependency: false
release_packaging:
  include_matrix: true
  include_research_sources: false
  research_source_root: "docs/open-project/"
  note: "docs/open-project 仅是当前研究输入，不安装到用户项目，也不进入发布包。"

references:
  - id: REF-OS-001
    source:
      project: OpenSpec
      repository: "https://github.com/Fission-AI/OpenSpec"
      version: "1.8.0"
      commit: "d57889664cab4f2f061d236ec3ff82a5578701bb"
      paths:
        - "schemas/spec-driven/schema.yaml"
        - "docs/workflows.md"
    mechanism: "Git-native Change、Spec Delta、Artifact Graph 与 Archive"
    decision:
      retained:
        - "Change 级 Markdown 产物和可追踪依赖"
        - "ADDED/MODIFIED/REMOVED/RENAMED 语义"
        - "验证后合并基线 Spec 并归档"
      changed:
        - "使用 RockSpec 自有 Schema、状态机、审批 Hash 和根级 .rockspec 目录"
      rejected:
        - "OpenSpec CLI、目录兼容层和运行时代码依赖"
    rockspec_targets:
      - "packages/protocol/src/spec.ts"
      - "packages/engine/src/engine.ts"
      - "skills/rockspec-requirements"
      - "skills/rockspec-finish"
    verification:
      - "packages/protocol/test/hash-spec.test.ts"
      - "packages/engine/test/engine.test.ts"
      - "packages/cli/test/cli.test.ts"
    implementation: independent
    license: MIT
    status: adopted

