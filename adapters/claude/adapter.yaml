schema_version: 2
id: "claude-code"
host: "Claude Code"
skills_root: "../../skills"
invocation:
  syntax: "/<skill-name> or host-supported explicit Skill invocation"
  orchestrator: "rockspec-change"
  atomic:
    triage: "rockspec-triage"
    requirements: "rockspec-requirements"
    design: "rockspec-design"
    prototype: "rockspec-prototype"
    plan: "rockspec-plan"
    implement: "rockspec-implement"
    review: "rockspec-review"
    acceptance: "rockspec-acceptance"
    finish: "rockspec-finish"
  scenarios:
    debug: "rockspec-debug"
    research: "rockspec-research"
    worktree: "rockspec-worktree"
subagents:
  spawn: "host-native Agent/Task primitive"
  resume: "host-native task resume primitive"
  wait: "host-native task wait primitive"
  execution_id_required: true
  worker_may_delegate: false
  cwd: "required and fixed to change.workspace for every worker and reviewer"
worktrees:
  inspect: "Git worktree facts plus host capability discovery"
  create: "prefer EnterWorktree/WorktreeCreate when exposed; otherwise git worktree add"
  resume: "fix every subsequent tool cwd to the registered worktree root"
  cleanup: "only after explicit finish disposition and clean ownership checks"
models:
  selection: "explicit for every subagent spawn"
  fallback: "upward-only; never silently use a weaker tier"
  deep_unavailable: "BLOCKED until the host mapping is reconfigured"
  tiers:
    fast:
      model: "haiku"
    balanced:
      model: "sonnet"
    deep:
      model: "opus"
reviewers:
  read_only: true
  distinct_from_implementer: true
state:
  owner: "RockSpec Engine"
  adapter_may_write: false
capabilities:
  discovery: "host skill registry"
  availability_declaration: "repeatable global --provider option or ROCKSPEC_AVAILABLE_PROVIDERS"
  preserve_provider_name: true
  ui.prototype:
    provider: "ui-ux-pro-max"
    distribution: "installed"
degradation:
  missing_subagent: "BLOCKED for Standard/Strict review actions"
  missing_provider: "BLOCKED for design.prototype"
