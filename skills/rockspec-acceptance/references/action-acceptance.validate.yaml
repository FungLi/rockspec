schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "acceptance.validate"
kind: "engine_action"
profiles: ["standard", "strict"]
summary: "针对已集成实现独立测试已批准的可观察行为。"
executor:
  mode: "subagent"
  role_prompt: "references/role-acceptance-test-engineer.md"
  count: 1
  may_delegate: false
  model_policy:
    strategy: "auto"
    default: "balanced"
    minimum: "balanced"
    deep_when_any:
      - "Profile 为 Strict。"
      - "验收涉及跨系统 E2E、安全、迁移、并发、关键数据或不可逆行为。"
      - "需要在多个环境或公共接缝上进行复杂失败与兼容性验证。"
    record_selection: true
reads:
  artifacts: ["已批准的 specs/**/*.md", "已批准的 design.md", "已批准的 prototype/**", "tasks.md"]
  repository: ["已集成实现", "现有验收约定"]
writes:
  artifacts: ["testing/test-plan.md", "testing/test-report.md", "验收证据"]
  repository: ["集成测试", "E2E 测试", "Fixture", "测试配置"]
preconditions:
  - "所有 Task 和 Remediation Task Gate 当前均通过。"
completion:
  required:
    - "TE 所有的产品测试资产已提交；.rockspec 外不存在未提交的产品或测试改动。"
    - "每个适用 Scenario 都映射到当前 Commit 上已执行的验收证据。"
    - "记录环境、命令、退出码、失败、跳过项和资产 Commit。"
    - "适用时由 ui.prototype 提供响应式、可访问性和交互证据。"
outcomes:
  pass: ["delivery.review"]
  implementation_failure: ["task.execute"]
  test_asset_failure: ["acceptance.validate"]
  blocked: ["acceptance.validate"]
invariants:
  - "Acceptance 不得修改业务实现。"
  - "设计测试计划时不得读取 Task Review 或 Delivery Review 结论。"
  - "Acceptance 创建的资产随后由 delivery.review 评审，而不是 task.review。"
