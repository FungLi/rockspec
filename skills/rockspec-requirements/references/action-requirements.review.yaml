schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "requirements.review"
kind: "engine_action"
profiles: ["standard", "strict"]
summary: "在用户批准 Spec 前独立评审 Proposal 和 Spec Delta。"
executor:
  mode: "subagent"
  role_prompt: "references/role-requirements-reviewer.md"
  count:
    standard: 1
    strict: 2
  read_only: true
  may_delegate: false
  model_policy:
    strategy: "auto"
    default: "balanced"
    minimum: "balanced"
    deep_when_any:
      - "Profile 为 Strict。"
      - "需求涉及安全、认证、授权、支付、隐私、合规、公共契约或不可逆行为。"
      - "Spec 跨多个独立业务能力，或包含复杂状态与兼容性判断。"
    record_selection: true
reads:
  artifacts: ["brief.md", "proposal.md", "specs/**/*.md"]
  repository: ["仅基线 Specs"]
writes:
  artifacts: ["reviews/requirements-review*.md"]
completion:
  required:
    - "每个 Reviewer 输出 PASS、CHANGES_REQUIRED 或 BLOCKED，并提供有证据支撑的 Finding。"
    - "Review Hash 与当前 Proposal 和 Specs 一致。"
    - "Strict 聚合保留两份原始报告和全部 Finding。"
outcomes:
  pass: []
  changes_required: ["requirements.clarify"]
  blocked: ["requirements.clarify"]
requires_user_approval_on_pass: "spec"
invariants:
  - "Reviewer 不得编辑需求产物或替代用户审批。"
