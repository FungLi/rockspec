schema_version: 1
change_id: "{{change_id}}"
commit: "{{commit_sha}}"
recorded_at: "{{recorded_at_iso8601}}"
runs:
  - command: "{{command}}"
    working_directory: "{{working_directory}}"
    started_at: "{{started_at_iso8601}}"
    finished_at: "{{finished_at_iso8601}}"
    exit_code: {{exit_code}}
    counts:
      passed: {{passed}}
      failed: {{failed}}
      skipped: {{skipped}}
    relates_to: ["{{requirement_task_or_test_id}}"]
    evidence_paths: ["{{log_screenshot_or_report_path}}"]
    summary: "{{summary}}"
