schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "change.verify"
kind: "engine_action"
profiles: ["lite", "standard", "strict"]
summary: "执行最终仓库验证，并将新鲜证据绑定到最终 Commit。"
executor:
  mode: "inline"
  role: "scenario-orchestrator"
reads:
  artifacts: ["brief.md", "当前 Profile 要求的全部产物、评审和证据"]
  repository: ["最终 Diff", "仓库验证配置"]
writes:
  artifacts: ["evidence/verification.yaml"]
preconditions:
  - "Lite 实施已完成，或 Delivery Review 已在当前最终 Commit 上通过。"
completion:
  required:
    - "必需测试、构建、Lint、类型检查和项目检查具有新鲜命令证据。"
    - "最终 Diff 在范围内，且不含无关或未评审改动。"
    - "没有必需检查被隐藏、过期或仅由 Agent 文字声明表示。"
outcomes:
  pass: ["change.archive"]
  implementation_failure: ["task.execute"]
  test_failure: ["acceptance.validate", "change.verify"]
  blocked: ["change.verify"]
invariants:
  - "如实记录非零退出码和跳过检查。"
  - "验证即将收尾的准确 Commit。"
