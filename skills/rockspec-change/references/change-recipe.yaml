schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "change"
entry_skill: "rockspec-change"
description: "由 Engine 管理状态、通过证据 Gate 控制的风险自适应变更交付。"
state_owner: "engine"
capability_skills:
  change.triage: "rockspec-triage"
  change.promote: "rockspec-triage"
  requirements.clarify: "rockspec-requirements"
  requirements.review: "rockspec-requirements"
  design.technical: "rockspec-design"
  design.prototype: "rockspec-prototype"
  plan.create: "rockspec-plan"
  readiness.review: "rockspec-plan"
  task.execute: "rockspec-implement"
  task.review: "rockspec-review"
  acceptance.validate: "rockspec-acceptance"
  delivery.review: "rockspec-review"
  change.verify: "rockspec-finish"
  knowledge.evolve: "rockspec-evolve"
  change.archive: "rockspec-finish"
interactive_skills:
  - "rockspec-research"
  - "rockspec-requirements"
  - "rockspec-design"
invariants:
  - "调用最新 Engine recommended_next.entry_skill 指定的原子 Skill。"
  - "只有 Engine 可以写入工作流状态、事件、审批和 Hash。"
  - "Worker Agent 不得委派；Reviewer 保持只读。"
  - "Acceptance 必须先于 delivery.review 完成。"
  - "每个已完成 Task 只拥有一个最终 Commit。"
  - "一个 Active Change 只绑定一个工作区；所有 Worker 和 Reviewer 使用该工作区 cwd。"
  - "交互 Skill 等待用户确认问题、方案或章节时必须结束当前回复；不得在同一回复中进入下一能力。"
  - "跨阶段内容变化必须通过 rockspec revise 从最上游受影响能力重放 Gate；已有 Open Revision 时使用 rockspec revise --amend 追加新 Review Findings，不得创建第二个 Revision。"
  - "首次 Gate 始终由用户审批；自动对账只能续期本次 Revision 失效且具有人工 Authority Baseline 的 Gate。"
workspace:
  skill: "rockspec-worktree"
  unit: "change"
  before_new: true
  user_runs_new: false
  task_parallelism: false
profiles:
  lite:
    reviewers: 0
    actions:
      - "change.triage"
      - "task.execute"
      - "change.verify"
      - "knowledge.evolve"
      - "change.archive"
    notes:
      - "task.execute 在当前能力 Agent 中内联执行，不创建 Task Subagent。"
      - "Lite 准入失效时立即升级为 Standard。"
  standard:
    reviewers: 1
    actions:
      - "change.triage"
      - "requirements.clarify"
      - "requirements.review"
      - "design.technical"
      - "design.prototype"
      - "plan.create"
      - "readiness.review"
      - "task.execute"
      - "task.review"
      - "acceptance.validate"
      - "delivery.review"
      - "change.verify"
      - "knowledge.evolve"
      - "change.archive"
    conditional:
      - action: "design.prototype"
        when: "prototype.required == true"
      - actions: ["task.execute", "task.review"]
        repeat: "对每个 Ready Task 重复，包括 Remediation Task"
    approval_gates:
      - id: "spec"
        after: "requirements.review"
        after_actions: ["requirements.review"]
        operation: "rockspec approve spec"
      - id: "design"
        after: "需要原型时在 design.prototype 后，否则在 design.technical 后"
        after_actions: ["design.technical", "design.prototype"]
        operation: "rockspec approve design"
      - id: "implementation"
        after: "readiness.review"
        after_actions: ["readiness.review"]
        operation: "rockspec approve implementation"
  strict:
    extends: "standard"
    reviewers: 2
    independent_review_actions:
      - "requirements.review"
      - "readiness.review"
      - "task.review"
      - "delivery.review"
    notes:
      - "保留两份报告，由 Engine 聚合结论和 Finding。"
      - "运行完整回归证据并限制 Task 并行实施。"
recovery:
  revision: "实施前可显式修订；实施后只允许绑定 non-PASS Review/Open Finding 的 Recovery Revision，并由 Engine 推导最早责任域"
  amendment: "Open Revision 期间发现新的 non-PASS Review/Open Finding 时追加 AM-xxx，扩展影响集并按最保守策略继续同一 Revision"
  reconciliation: "仅 consistency_fix、derived_gap 或 implementation_fix 且 authority_impact=unchanged、非 Critical 时自动；独立 Reviewer 续期既有人工 Gate"
  max_reconciliation_rounds: 2
  escalation: "首次审批、decision_change、intent_change、risk_acceptance、changed/unknown authority、Critical、Reviewer 分歧或超时转人工"
  max_task_repair_rounds: 2
  task_review_failure: "task.execute"
  acceptance_implementation_failure: "回到 plan.create，新增映射触发 Finding 的 Remediation Task，重新 Readiness/审批后执行"
  stale_approval: "返回负责 Action 并请求重新审批"
  missing_capability: "BLOCKED"
standalone:
  artifact_root: ".rockspec/workbench/<capability>/<slug>/"
  receipt: "receipt.yaml"
  invariants:
    - "Standalone 结果不得声称已获得治理审批或完成完整 Change。"
    - "原子 Skill 可以从现有外部产物开始，无需重放之前的能力。"
