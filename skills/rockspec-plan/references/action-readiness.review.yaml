schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "readiness.review"
kind: "engine_action"
profiles: ["standard", "strict"]
summary: "独立验证 Design、Prototype、Plan、Task 和前置条件是否已可实施。"
executor:
  mode: "subagent"
  role_prompt: "references/role-readiness-reviewer.md"
  count:
    standard: 1
    strict: 2
  read_only: true
  may_delegate: false
  model_policy:
    strategy: "auto"
    default: "balanced"
    minimum: "balanced"
    deep_when_any:
      - "Profile 为 Strict。"
      - "Design 涉及架构边界、安全、迁移、并发、数据一致性或公共契约。"
      - "Plan 包含复杂 Task DAG、多个模块或大量跨 Task 接口。"
    record_selection: true
reads:
  artifacts: ["已批准的 specs/**/*.md", "design.md", "prototype/**", "plan.md", "tasks.md", "tasks/T-*.md"]
  repository: ["仓库规则", "已声明接口", "环境和测试事实"]
writes:
  artifacts: ["reviews/readiness-review*.md"]
  template: "assets/readiness-review.md"
completion:
  required:
    - "每份 Reviewer 报告使用 schema_version/verdict/reviewer_execution_id/findings Frontmatter；非 PASS 至少包含一个 Open Finding。"
    - "已评审覆盖关系、决策、DAG、Task 粒度、风险、回滚、测试和前置条件。"
    - "每个 Finding 声明 classification 和 authority_impact。"
    - "Review Hash 与当前 Design、Prototype、Plan 和 Tasks 一致。"
    - "Strict 聚合保留两份原始报告和全部 Finding。"
    - "PASS 后运行 preflight implementation；安装一致性、审批新鲜度、Task DAG、Recovery 和两种 Task Review 路径全部通过后才请求或续期实施审批。"
outcomes:
  pass: []
  changes_required: ["design.technical", "plan.create"]
  blocked: ["readiness.review"]
requires_user_approval_on_pass: "首次 Implementation 或 gate_policies.implementation=human；auto 改由 reconcile.implementation 续期，preserve 不重复审批"
invariants:
  - "Reviewer 不得编辑被评审产物；普通 Review 不得替代首次用户审批，Reconciliation Review 只能续期已有 Authority Baseline。"
