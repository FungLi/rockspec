schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "delivery.review"
kind: "engine_action"
profiles: ["standard", "strict"]
summary: "在验收和修复完成后，对最终分支执行 Final CR。"
executor:
  mode: "subagent"
  role_prompt: "references/role-delivery-reviewer.md"
  count:
    standard: 1
    strict: 2
  read_only: true
  may_delegate: false
  model_policy:
    strategy: "fixed"
    default: "deep"
    minimum: "deep"
    record_selection: true
reads:
  artifacts: ["Delivery Role Context Package", "runtime/reviews/delivery-*.diff", "已批准的 Specs、Design 和 Prototype", "全部 Task 报告和评审", "testing/test-plan.md", "testing/test-report.md", "全部证据"]
  repository: ["只通过 Review Package 读取基线..验收后最终 Commit Diff", "仓库规则"]
writes:
  artifacts: ["reviews/delivery-review*.md"]
preconditions:
  - "Acceptance 在当前 Commit 上通过。"
  - "所有修复已完成，之后不存在新的实施改动。"
  - "Engine 已生成唯一 Review Package，并返回 base_commit、head_commit 和 diff_hash。"
  - "Reviewer execution ID 不属于任何 Task Implementer。"
completion:
  required:
    - "报告 YAML Frontmatter 原样绑定 Review Subject、Reviewer execution ID 和 round。"
    - "已评审 Spec、Design、规范、测试、追踪关系、范围和交付风险。"
    - "TE 创建的测试、Fixture、配置和 UI 证据均纳入范围。"
    - "非 PASS 至少有一个 Open Finding；所有 Finding 均在 Frontmatter 声明 classification 和 authority_impact。"
    - "不存在未关闭的 Critical 或 Important Finding。"
    - "Strict 聚合保留两份报告和全部 Finding。"
outcomes:
  pass: ["change.verify"]
  implementation_failure: ["revise", "plan.create", "task.execute"]
  acceptance_asset_failure: ["acceptance.validate"]
  blocked: ["revise", "delivery.review"]
invariants:
  - "Final CR 不能在验收前运行，也不能编辑被评审分支。"
  - "Review Package 是唯一 Diff 来源；Subject 变化后旧报告失效。"
