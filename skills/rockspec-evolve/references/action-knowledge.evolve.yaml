schema_version: 1
authority: "agent-guidance"
engine_authority: "packages/engine/src/workflow.ts"
id: "knowledge.evolve"
kind: "engine_action"
profiles: ["lite", "standard", "strict"]
summary: "从最终验证通过的 Change 中提炼可复用知识，并记录可幂等归档的 Delta 和凭证。"
executor:
  mode: "inline"
  role: "knowledge-evolution-orchestrator"
reads:
  artifacts: ["Requirements", "Design", "Prototype", "Acceptance", "Delivery Review", "最终验证证据"]
  repository: [".rockspec/specs/**", ".rockspec/knowledge/**"]
writes:
  artifacts: ["knowledge-delta.md", "knowledge/updates/**", "knowledge-evolution.yaml", "reviews/knowledge-review.md（仅 normative）"]
preconditions:
  - "Change 已完成最终验证并处于 READY_TO_FINISH。"
  - "候选知识来自已验证产物，不改变已交付产品行为。"
completion:
  required:
    - "no_change 或每个更新都有稳定来源和完整候选文件。"
    - "derived 更新已完成 Author 自检和 Engine 确定性校验；normative 更新已通过独立 Knowledge Review。"
    - "normative 更新已获得用户明确确认。"
    - "Engine 已记录与冻结输入一致的 Change 侧凭证。"
outcomes:
  pass: ["finish", "change.archive"]
  review_failure: ["knowledge.evolve"]
  baseline_diverged: ["knowledge.evolve"]
  blocked: ["knowledge.evolve"]
invariants:
  - "Skill 不得直接改写 .rockspec/knowledge/**；只有归档事务可以安装候选和写 canonical receipt。"
  - "no_change 必须留下凭证。"
  - "产品行为以 .rockspec/specs/** 为唯一权威来源。"
  - "无法证明为直接派生的候选必须标记为 normative，不得用 derived 规避人工确认或独立 Review。"
